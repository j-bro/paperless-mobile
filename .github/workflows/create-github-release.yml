name: Create GitHub Release
on:
  # Enable manual run
  workflow_dispatch:
    inputs:
      is_draft:
        description: "Mark as draft"
        required: true
        default: true
        type: boolean
      is_prerelease:
        description: "Mark as prerelease"
        required: true
        default: true
        type: boolean
      tag:
        description: "Release tag (default: v<version_name> from pubspec)"
        required: false
        default: ""
        type: string

# Release creation + asset upload needs write; everything else stays none.
permissions:
  contents: write

jobs:
  create-github-release:
    runs-on: ubuntu-latest
    steps:
      # Setup Ruby, Bundler, and Gemfile dependencies
      - name: Create build directory
        run: mkdir -p /tmp/build

      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >>$GITHUB_OUTPUT
        id: extract_branch

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Copy files to build directory
        run: |
          mkdir -p /tmp/build
          cp -R . /tmp/build

      - name: Set FLUTTER_ROOT environment variable and build dir
        run: echo "FLUTTER_ROOT=/tmp/build/flutter/bin" >> $GITHUB_ENV

      - run: $FLUTTER_ROOT/flutter doctor -v

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup signing config
        uses: ./.github/actions/setup-android-signing-config
        with:
          keystore-key-alias: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          keystore-key-password: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keystore-store-password: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          release-keystore: ${{ secrets.RELEASE_KEYSTORE }}
          release-keystore-passphrase: ${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}
          output-directory: /tmp/build/android

      - name: Get packages and run codegen
        run: |
          bash /tmp/build/scripts/install_dependencies_with_submodule.sh
          bash /tmp/build/scripts/update_changelogs.sh

      - name: Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: /tmp/build/android

      - name: Build signed release APKs
        run: |
          cd /tmp/build/android
          bundle exec fastlane github

      - name: Publish GitHub release with APKs
        run: |
          cd /tmp/build/android
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(grep '^version:' /tmp/build/pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"
          fi
          FLAGS="--target ${{ steps.extract_branch.outputs.branch }} --generate-notes"
          [ "${{ github.event.inputs.is_draft }}" = "true" ] && FLAGS="$FLAGS --draft"
          [ "${{ github.event.inputs.is_prerelease }}" = "true" ] && FLAGS="$FLAGS --prerelease"
          # shellcheck disable=SC2086
          gh release create "$TAG" $FLAGS ../build/app/outputs/flutter-apk/app-release.apk ../build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../build/app/outputs/flutter-apk/app-x86_64-release.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
