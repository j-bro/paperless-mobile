name: Create Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v4.5.0-fork.1)"
        required: true
      draft:
        description: "Mark as draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      # Probe once whether real signing secrets exist; the `secrets`
      # context can't be used directly in `if:` conditions.
      - name: Check for release signing secrets
        id: signing
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "${RELEASE_KEYSTORE:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Reuse the existing signing action when the fork has
      # real release secrets configured.
      - name: Setup signing config
        if: steps.signing.outputs.available == 'true'
        uses: ./.github/actions/setup-android-signing-config
        with:
          keystore-key-alias: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          keystore-key-password: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keystore-store-password: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          release-keystore: ${{ secrets.RELEASE_KEYSTORE }}
          release-keystore-passphrase: ${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}
          output-directory: android

      # Fallback for forks without secrets: self-signed ephemeral
      # keystore so `flutter build apk --release` still succeeds.
      # APKs built this way cannot update Play Store / upstream installs.
      - name: Setup ephemeral signing (no secrets)
        if: steps.signing.outputs.available != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore android/app/fork-release.jks \
            -alias fork -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Fork, OU=Fork, O=Fork, C=US"
          cat > android/key.properties <<'EOF'
          storeFile=fork-release.jks
          keyAlias=fork
          storePassword=android
          keyPassword=android
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with tag
        run: cp build/app/outputs/flutter-apk/app-release.apk paperless-mobile-${{ inputs.tag }}.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: paperless-mobile-${{ inputs.tag }}.apk
